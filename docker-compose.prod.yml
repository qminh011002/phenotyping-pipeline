services:
  backend:
    image: ghcr.io/${REGISTRY_OWNER:-qminh011002}/phenotyping-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/phenotyping/.env.production
    environment:
      BACKEND_HOST: "127.0.0.1"
      BACKEND_PORT: "8000"
      GUNICORN_WORKERS: "2"
    volumes:
      - /var/lib/phenotyping/overlays:/data/overlays
      - /var/lib/phenotyping/models:/data/models
      - /var/lib/phenotyping/inference_config.yaml:/data/inference_config.yaml

  frontend:
    image: ghcr.io/${REGISTRY_OWNER:-qminh011002}/phenotyping-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
