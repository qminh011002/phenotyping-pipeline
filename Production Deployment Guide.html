  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

al;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"78156b88-3659-407d-bd52-8b16d3195951\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"31a7c19e-c825-40bb-9cbb-096a11645820\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6f262a07-207b-405b-bf7b-47f71bc931b2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1eefdb75-b028-4b94-83e0-39124dbccd41\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* =========================================================================\n   Production Deployment Guide — reading shell\n   ========================================================================= */\n\n:root {\n  /* Light theme (Ayu Light–inspired warmth) */\n  --bg:        #FAF9F6;\n  --bg-elev:   #FFFFFF;\n  --bg-sub:    #F2F0EA;\n  --bg-code:   #F5F2EA;\n  --bg-code-block: #FAF7EE;\n  --ink:       #0F1419;\n  --ink-2:     #3D424D;\n  --ink-3:     #6B7280;\n  --ink-4:     #9CA3AF;\n  --rule:      #E8E3D6;\n  --rule-2:    #D9D3C2;\n  --accent:    #C2410C;        /* rust */\n  --accent-2:  #B7541E;\n  --accent-bg: #FCEFE2;\n  --link:      #B6531C;\n  --link-hover:#8C3A0F;\n\n  /* Callout palette */\n  --note-bg:    #FFF8EC;\n  --note-bd:    #E6C77B;\n  --note-ink:   #6B4F12;\n  --warn-bg:    #FFEEE2;\n  --warn-bd:    #E89A6A;\n  --warn-ink:   #7A2E07;\n\n  /* Syntax — bash/python/yaml/dockerfile/nginx */\n  --syn-comment: #8C8675;\n  --syn-keyword: #B6531C;       /* kw, fu */\n  --syn-string:  #5C7A1E;       /* st */\n  --syn-var:     #1F6FB2;       /* va */\n  --syn-num:     #9A4D00;       /* dv */\n  --syn-op:      #5B6470;\n  --syn-fn:      #1F6FB2;\n  --syn-attr:    #5B7A14;       /* at */\n  --syn-cf:      #9F2D2D;       /* cf - control flow */\n\n  /* Type */\n  --serif: 'Source Serif 4', 'Source Serif Pro', 'Georgia', ui-serif, serif;\n  --sans:  'IBM Plex Sans', 'Söhne', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;\n\n  /* Layout */\n  --sidebar-w: 296px;\n  --toc-w:     232px;\n  --reading-max: 760px;\n  --header-h:  60px;\n\n  /* Motion */\n  --ease: cubic-bezier(.2,.6,.2,1);\n}\n\nhtml[data-theme=\"dark\"] {\n  --bg:        #0B0E14;\n  --bg-elev:   #0F141B;\n  --bg-sub:    #131923;\n  --bg-code:   #0E131B;\n  --bg-code-block: #0A0E15;\n  --ink:       #E6E1CF;\n  --ink-2:     #B5B095;\n  --ink-3:     #7E8694;\n  --ink-4:     #565E6B;\n  --rule:      #1B222D;\n  --rule-2:    #232C3A;\n  --accent:    #FF8C5A;\n  --accent-2:  #FFA374;\n  --accent-bg: #2A1810;\n  --link:      #FFA374;\n  --link-hover:#FFC59A;\n\n  --note-bg:    #1F1A0F;\n  --note-bd:    #6B541A;\n  --note-ink:   #E8C77B;\n  --warn-bg:    #2A140A;\n  --warn-bd:    #8A4422;\n  --warn-ink:   #FFB893;\n\n  --syn-comment: #5C6773;\n  --syn-keyword: #FF8C5A;\n  --syn-string:  #B8CC52;\n  --syn-var:     #5CCFE6;\n  --syn-num:     #FFB454;\n  --syn-op:      #95A0AB;\n  --syn-fn:      #5CCFE6;\n  --syn-attr:    #BAE67E;\n  --syn-cf:      #FF6B6B;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--bg) !important;\n  color: var(--ink);\n  font-family: var(--serif);\n  font-size: 17px;\n  line-height: 1.7;\n  font-feature-settings: \"kern\", \"liga\", \"calt\";\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n::selection { background: var(--accent-bg); color: var(--ink); }\n\n/* =========================================================================\n   Top progress bar\n   ========================================================================= */\n.progress {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: transparent;\n  z-index: 200;\n  pointer-events: none;\n}\n.progress__bar {\n  height: 100%;\n  width: 0%;\n  background: linear-gradient(90deg, var(--accent), var(--accent-2));\n  transition: width 80ms linear;\n}\n\n/* =========================================================================\n   Header\n   ========================================================================= */\n.site-header {\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  height: var(--header-h);\n  background: color-mix(in srgb, var(--bg) 86%, transparent);\n  backdrop-filter: saturate(140%) blur(14px);\n  -webkit-backdrop-filter: saturate(140%) blur(14px);\n  border-bottom: 1px solid var(--rule);\n  display: flex;\n  align-items: center;\n  padding: 0 24px;\n  font-family: var(--sans);\n}\n.site-header__brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-weight: 600;\n  font-size: 14.5px;\n  letter-spacing: -0.005em;\n  color: var(--ink);\n}\n.site-header__mark {\n  width: 26px; height: 26px;\n  border-radius: 7px;\n  background: var(--ink);\n  color: var(--bg);\n  display: grid;\n  place-items: center;\n  font-family: var(--mono);\n  font-size: 11.5px;\n  font-weight: 700;\n  letter-spacing: -0.02em;\n}\nhtml[data-theme=\"dark\"] .site-header__mark { background: var(--accent); color: #0B0E14; }\n.site-header__title { color: var(--ink); }\n.site-header__sub {\n  color: var(--ink-3);\n  font-weight: 400;\n  font-size: 13px;\n  margin-left: 6px;\n  padding-left: 12px;\n  border-left: 1px solid var(--rule-2);\n}\n.site-header__right {\n  margin-left: auto;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  height: 26px;\n  padding: 0 10px;\n  border-radius: 999px;\n  background: var(--bg-sub);\n  border: 1px solid var(--rule);\n  color: var(--ink-2);\n  font-family: var(--sans);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  white-space: nowrap;\n}\n.pill__dot {\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: #4ade80;\n  box-shadow: 0 0 0 3px color-mix(in srgb, #4ade80 22%, transparent);\n}\n.icon-btn {\n  width: 32px; height: 32px;\n  border-radius: 8px;\n  border: 1px solid transparent;\n  background: transparent;\n  color: var(--ink-2);\n  cursor: pointer;\n  display: grid;\n  place-items: center;\n  transition: all 120ms var(--ease);\n}\n.icon-btn:hover { background: var(--bg-sub); border-color: var(--rule); color: var(--ink); }\n.icon-btn svg { width: 16px; height: 16px; }\n\n/* =========================================================================\n   Layout: sidebar | reading | toc\n   ========================================================================= */\n.layout {\n  display: grid;\n  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);\n  gap: 0;\n  max-width: 1480px;\n  margin: 0 auto;\n  background: var(--bg);\n}\n.sidebar, .reading-wrap, .toc { background: var(--bg); }\n\n/* ---------- Sidebar ---------- */\n.sidebar {\n  position: sticky;\n  top: var(--header-h);\n  align-self: start;\n  height: calc(100vh - var(--header-h));\n  overflow-y: auto;\n  padding: 28px 8px 40px 24px;\n  border-right: 1px solid var(--rule);\n  font-family: var(--sans);\n  font-size: 13.5px;\n  scrollbar-widt
